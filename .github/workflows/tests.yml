name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suivi_test
          POSTGRES_PASSWORD: test-only-local-password
          POSTGRES_DB: suivi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suivi_test -d suivi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WHOOP_TEST_DATABASE_URL: postgresql://suivi_test:test-only-local-password@127.0.0.1:5432/suivi_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Python version
        id: py
        run: |
          if [ -f runtime.txt ]; then
            version="$(sed 's/^python-//' runtime.txt | tr -d '[:space:]')"
          else
            version="3.11"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
